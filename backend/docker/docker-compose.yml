services:
  backend:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: iris-backend
    ports:
      - "8080:8080"
    environment:
      # 環境変数（本番環境では.envファイルや環境変数から読み込み）
      - ENVIRONMENT=development
      - LOG_LEVEL=info
    # env_file:
    #   - ../.env  # 必要に応じてコメント解除
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - iris-network

networks:
  iris-network:
    driver: bridge
