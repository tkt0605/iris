services:
  backend:
    build:
      context: ..
      dockerfile: docker/dockerfile
    image: iris-backend:latest
    container_name: iris-backend

    # リソース制限
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

    # DNS設定（WSL2等での名前解決問題対策）
    dns:
      - 8.8.8.8
      - 8.8.4.4

    # ボリューム
    volumes:
      - ../app:/app

    ports:
      - "8080:8080"

    environment:
      ENVIRONMENT: development
      LOG_LEVEL: info

    env_file:
      - .env

    restart: unless-stopped

    networks:
      - iris-network

networks:
  iris-network:
    driver: bridge
